[workspace]
members  = [ "crates/bridge", "crates/jni", "crates/listener", "crates/patcher" ]
resolver = "2"

[workspace.dependencies]
aes-gcm = { default-features = false, features = [ "aes", "alloc" ], version = "0.11" }
anyhow = "1"
axum = {
	default-features = false,
	features = [
		"http1",
		"json",
		"query",
		"tokio",
		"tracing",
	],
	version = "0.8",
}
bytes = "1.10"
data-encoding = "2.11"
etcetera = "0.11"
fastwebsockets = {
	default-features = false,
	features = [
		"upgrade",
		"with_axum",
	],
	version = "0.10",
}
flate2 = { default-features = false, features = [ "zlib-rs" ], version = "1.0" }
futures-util = "0.3"
hkdf = "0.13"
hmac = "0.13"
jni = { default-features = false, version = "0.21.1" }
p256 = { default-features = false, features = [ "ecdh", "ecdsa" ], version = "0.14" }
pin-project-lite = "0.2"
pound = "0.1.6"
pushcompat-listener = { path = "crates/listener" }
quick-protobuf = "0.8.1"
rand = "0.8"
regex-lite = "0.1.9"
reqwest = { default-features = false, features = [ "json", "rustls-tls" ], version = "0.12.28" }
rusqlite = { features = [ "bundled" ], version = "0.37" }
rustls = { default-features = false, features = [ "ring", "std", "tls12" ], version = "0.23" }
serde = { features = [ "derive" ], version = "1.0" }
serde_json = "1.0"
sha2 = { default-features = false, version = "0.11" }
subtle = "2"
tokio = {
	features = [
		"io-util",
		"macros",
		"net",
		"rt-multi-thread",
		"sync",
		"time",
	],
	version = "1",
}
tokio-rusqlite = "0.7"
tokio-rustls = { default-features = false, features = [ "ring", "tls12" ], version = "0.26" }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { default-features = false, features = [ "fmt" ], version = "0.3" }
url = "2"
urlencoding = "2.1"
walkdir = "2"
webpki-roots = "1"
zip = { default-features = false, features = [ "deflate-flate2-zlib-rs" ], version = "8.6.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction                      = { level = "warn", priority = -1 }

arbitrary_source_item_ordering  = "allow"
arithmetic_side_effects         = "allow"
as_conversions                  = "allow"
big_endian_bytes                = "allow"
cast_possible_truncation        = "allow"
cast_possible_wrap              = "allow"
cast_sign_loss                  = "allow"
cognitive_complexity            = "allow"
default_numeric_fallback        = "allow"
else_if_without_else            = "allow"
error_impl_error                = "allow"
exhaustive_enums                = "allow"
exhaustive_structs              = "allow"
expect_used                     = "allow"
float_arithmetic                = "allow"
impl_trait_in_params            = "allow"
implicit_return                 = "allow"
indexing_slicing                = "allow"
infinite_loop                   = "allow"
integer_division                = "allow"
integer_division_remainder_used = "allow"
iter_over_hash_type             = "allow"
let_underscore_must_use         = "allow"
let_underscore_untyped          = "allow"
little_endian_bytes             = "allow"
map_err_ignore                  = "allow"
missing_docs_in_private_items   = "allow"
missing_inline_in_public_items  = "allow"
mod_module_files                = "allow"
module_name_repetitions         = "allow"
multiple_crate_versions         = "allow"
needless_borrowed_reference     = "allow"
non_ascii_literal               = "allow"
pattern_type_mismatch           = "allow"
print_stderr                    = "allow"
print_stdout                    = "allow"
pub_use                         = "allow"
pub_with_shorthand              = "allow"
question_mark_used              = "allow"
ref_patterns                    = "allow"
semicolon_outside_block         = "allow"
separated_literal_suffix        = "allow"
shadow_reuse                    = "allow"
shadow_unrelated                = "allow"
similar_names                   = "allow"
single_call_fn                  = "allow"
single_char_lifetime_names      = "allow"
std_instead_of_alloc            = "allow"
std_instead_of_core             = "allow"
string_slice                    = "allow"
struct_excessive_bools          = "allow"
tests_outside_test_module       = "allow"
too_many_lines                  = "allow"
unimplemented                   = "allow"
unreachable                     = "allow"
unwrap_in_result                = "allow"
unwrap_used                     = "allow"
wildcard_enum_match_arm         = "allow"

[profile.release]
codegen-units = 1
lto           = "thin"
panic         = "unwind"
strip         = true
